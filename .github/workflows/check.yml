name: Roadmap checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check curriculum and generated files
        run: python scripts/check.py
      - name: Check JavaScript syntax
        run: node --check dist/app.js
